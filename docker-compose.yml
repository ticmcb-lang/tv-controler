services:
  tv-controler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tv-controler
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - SELF_HOSTED=${SELF_HOSTED:-true}
      - HIDE_BILLING=${HIDE_BILLING:-true}
      - DISABLE_HOMEPAGE=${DISABLE_HOMEPAGE:-true}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      - DATA_DIR=/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - st-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  st-data:
